name: Aurora forecast

on:
  schedule:
    # Tout en UTC. NOAA publie vers 00:30 et 12:30 UTC.
    - cron: "15 1 * * *"
    - cron: "15 13 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write   # commit de docs/ (historique + évite la désactivation du cron après 60 j sans activité)
  pages: write
  id-token: write

concurrency:
  group: aurora-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Forecast
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_URL: https://alexis-sk.github.io/aurora/
        run: python forecast.py --out docs

      - name: Commit data
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
