name: Aurora forecast

on:
  schedule:
    # Tout en UTC. NOAA publie vers 00:30 et 12:30 UTC.
    - cron: "12 1 * * *"
    - cron: "12 13 * * *"
    - cron: "12 17 * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Envoyer une alerte de test (issue GitHub)"
        type: boolean
        default: false

permissions:
  contents: write   # commit de docs/ (historique + évite la désactivation du cron après 60 j sans activité)
  issues: write     # alerte : issue GitHub qui mentionne le propriétaire (mail + push GitHub Mobile)
  pages: write
  id-token: write

concurrency:
  group: aurora-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m unittest discover tests

      - name: Forecast
        env:
          PAGE_URL: https://alexis-sk.github.io/aurora/
        run: python forecast.py --out docs --alert-file alert.md

      - name: Alerte (issue GitHub)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          TEST_ALERT: ${{ inputs.test_alert }}
        run: |
          set -euo pipefail
          LABEL=aurora-alert
          gh label create "$LABEL" --repo "$REPO" --color d43d00 --description "Alerte Kp NOAA >= 5" --force >/dev/null
          if [ "${TEST_ALERT:-false}" = "true" ]; then
            printf 'Notification de **test** déclenchée manuellement : aucune alerte réelle. Le prochain run planifié fermera cette issue.\n' > alert.md
          fi
          OPEN=$(gh issue list --repo "$REPO" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -f alert.md ]; then
            BODY="@${OWNER} $(cat alert.md)"
            if [ -z "$OPEN" ]; then
              URL=$(gh issue create --repo "$REPO" --label "$LABEL" --title "Alerte aurores : Kp ≥ 5 prévu" --body "$BODY")
              gh issue lock "${URL##*/}" --repo "$REPO"   # commentaires réservés aux collaborateurs
            else
              gh issue comment "$OPEN" --repo "$REPO" --body "$BODY"
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --repo "$REPO" --comment "Fin d'alerte : plus aucune tranche NOAA à Kp ≥ 5."
          fi

      - name: Commit data
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin main   # la tâche Claude a pu pousser docs/rapport.json pendant le run
          git push

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        if: ${{ !cancelled() && hashFiles('docs/index.html') != '' }}
